<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPTILIAN</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* subtle noise grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 99;
    opacity: 0.5;
  }

  .scene {
    position: relative;
    width: 560px;
    height: 720px;
  }

  /* ── TEXT BEHIND ── */
  .text-behind {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    gap: 0px;
  }

  .word {
    font-family: 'Bebas Neue', 'Black Han Sans', sans-serif;
    font-size: 148px;
    font-weight: 900;
    letter-spacing: -4px;
    line-height: 0.80;
    text-transform: uppercase;
    display: block;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* 
    Outfit palette: 
      - Red hoodie  → #D42020
      - Black leather → #1a1a1a / #222
      - Army green dino → #4A5C2A
      - Silver chain → #C0C0C0
  */

  .word-rep {
    /* Red → dark red: matches the hoodie */
    background-image: linear-gradient(160deg,
      #ff6b35 0%,
      #D42020 30%,
      #8B0000 65%,
      #3d0000 100%
    );
    filter: drop-shadow(0 0 32px rgba(212,32,32,0.5));
  }

  .word-til {
    /* Olive green → black: matches dino skin + leather jacket */
    background-image: linear-gradient(160deg,
      #6b7c3a 0%,
      #4A5C2A 30%,
      #2a3318 60%,
      #111 100%
    );
    filter: drop-shadow(0 0 24px rgba(74,92,42,0.4));
  }

  .word-ian {
    /* Silver → dark: matches chain + accessories */
    background-image: linear-gradient(160deg,
      #e8e8e8 0%,
      #C0C0C0 25%,
      #888 55%,
      #333 100%
    );
    filter: drop-shadow(0 0 20px rgba(192,192,192,0.3));
  }

  /* ── IMAGE ON TOP ── */
  .img-wrapper {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .img-wrapper img {
    width: 110%;
    height: 110%;
    object-fit: contain;
    mix-blend-mode: multiply;
    transform: translateY(2%);
  }

  /* ── VIGNETTE ── */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(10,10,10,0.65) 100%
    );
    z-index: 3;
    pointer-events: none;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="scene">

  <!-- TEXT — BEHIND -->
  <div class="text-behind">
    <span class="word word-rep">REP</span>
    <span class="word word-til">TIL</span>
    <span class="word word-ian">IAN</span>
  </div>

  <!-- IMAGE — ON TOP -->
  <div class="img-wrapper">
    <img src="reptilian.png" alt="Reptilian">
  </div>

  <div class="vignette"></div>
</div>

<script>
  let t = 0;
  const rep = document.querySelector('.word-rep');
  const til = document.querySelector('.word-til');
  const ian = document.querySelector('.word-ian');

  function animateGrad() {
    t += 0.003;
    const a = (Math.sin(t) * 20 + 160).toFixed(1);
    const p = (Math.sin(t * 0.6) * 15 + 50).toFixed(1);

    // Red layer pulses
    rep.style.backgroundImage = `linear-gradient(${a}deg,
      #ff6b35 0%, #D42020 ${p}%, #8B0000 75%, #3d0000 100%)`;

    // Green layer slow shift
    til.style.backgroundImage = `linear-gradient(${a}deg,
      #6b7c3a 0%, #4A5C2A ${p}%, #2a3318 70%, #111 100%)`;

    // Silver layer subtle shimmer
    ian.style.backgroundImage = `linear-gradient(${a}deg,
      #e8e8e8 0%, #C0C0C0 ${p}%, #777 60%, #222 100%)`;

    requestAnimationFrame(animateGrad);
  }
  animateGrad();
</script>
</body>
</html>
